name: Auto-Merge on Copilot Approval

on:
  # Fires when Copilot first reviews
  pull_request_review:
    types: [submitted]
  # Fires when new commits are pushed (after fixing suggestions)
  pull_request:
    types: [synchronize]
  # Fires when Copilot's check suite completes (reliable for Copilot reviews)
  check_suite:
    types: [completed]
  # Fires after PR Review workflow completes (backup trigger)
  workflow_run:
    workflows: ["PR Review"]
    types: [completed]
  # Manual trigger from CLI: gh workflow run auto-merge.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request'
      || github.event_name == 'check_suite'
      || github.event_name == 'workflow_run'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request_review'
          && github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
          && (github.event.review.state == 'APPROVED' || github.event.review.state == 'COMMENTED'))
    steps:
      - name: Check and merge if ready
        uses: actions/github-script@v7
        with:
          script: |
            // Collect PR numbers to process (may be one or many)
            let prNumbers = [];

            if (context.payload.pull_request) {
              prNumbers = [context.payload.pull_request.number];
            } else if (context.payload.check_suite) {
              // Process all associated PRs, not just the first
              const prs = context.payload.check_suite.pull_requests;
              if (prs && prs.length > 0) prNumbers = prs.map(p => p.number);
            } else if (context.payload.review) {
              prNumbers = [context.payload.pull_request.number];
            }

            // For workflow_run triggers, try payload PRs first
            if (prNumbers.length === 0 && context.payload.workflow_run) {
              const prs = context.payload.workflow_run.pull_requests;
              if (prs && prs.length > 0) {
                prNumbers = prs.map(p => p.number);
              }
            }

            // Sweep fallback: when no PR in payload (workflow_run on dev),
            // check all open PRs. This handles clean PRs where the only
            // trigger was pull_request_review from Copilot (blocked by GitHub
            // as action_required for bot-initiated reviews).
            if (prNumbers.length === 0) {
              console.log('No PR in payload, sweeping all open PRs targeting dev...');
              const { data: openPRs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'dev',
                per_page: 100
              });
              prNumbers = openPRs.map(pr => pr.number);
              if (prNumbers.length === 0) {
                console.log('No open PRs found');
                return;
              }
              console.log(`Found ${prNumbers.length} open PRs: ${prNumbers.join(', ')}`);
            }

            // Deduplicate PR numbers
            prNumbers = [...new Set(prNumbers)];

            // Process each PR
            for (const prNumber of prNumbers) {
              console.log(`Checking PR #${prNumber}...`);

              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });

              if (prData.state !== 'open' || prData.merged) continue;

              // Check if we already auto-merged (dedup)
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              });
              if (comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes('Auto-merged'))) {
                continue;
              }

              // Check if Copilot has reviewed (must not be CHANGES_REQUESTED)
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              const copilotReviews = reviews.filter(
                r => r.user.login === 'copilot-pull-request-reviewer[bot]'
              );
              if (copilotReviews.length === 0) {
                console.log(`PR #${prNumber}: no Copilot review yet`);
                continue;
              }
              // Check the latest Copilot review state
              const latestReview = copilotReviews[copilotReviews.length - 1];
              if (latestReview.state === 'CHANGES_REQUESTED') {
                console.log(`PR #${prNumber}: Copilot requested changes, skipping`);
                continue;
              }

              // Require the test suite to have PASSED on the head commit.
              // The Tests workflow (tests.yml) runs the system suite on
              // every PR; a missing or failed run blocks the merge. Named
              // check runs are matched by the job name 'system-suite'.
              const { data: checkData } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: prData.head.sha,
                per_page: 100
              });
              const testRuns = checkData.check_runs.filter(c => c.name === 'system-suite');
              const testsPassed = testRuns.some(c => c.conclusion === 'success');
              if (!testsPassed) {
                const state = testRuns.length === 0 ? 'has not run' : 'has not passed';
                console.log(`PR #${prNumber}: test suite ${state} on head ${prData.head.sha}; skipping`);
                continue;
              }

              // Check for unresolved Copilot review threads.
              //
              // Why thread state and not commit_id matching: when a push fixes
              // a comment WITHOUT rewriting its exact anchored lines, GitHub
              // remaps the surviving comment onto the new head commit and
              // updates its commit_id, so `commit_id === head.sha` re-counts
              // already-addressed feedback forever (PR #146). Thread state is
              // the first-class signal: a thread blocks until it is resolved
              // (reply citing the fixing commit, then resolve) or its anchor
              // lines are rewritten (isOutdated).
              let unresolvedThreads = 0;
              let cursor = null;
              while (true) {
                const resp = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            isResolved
                            isOutdated
                            comments(first: 1) { nodes { author { login } } }
                          }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: prNumber,
                  cursor
                });
                const threads = resp.repository.pullRequest.reviewThreads;
                // GraphQL may return the bot login with or without the
                // [bot] suffix depending on API surface; accept both.
                const copilotLogins = ['copilot-pull-request-reviewer', 'copilot-pull-request-reviewer[bot]'];
                unresolvedThreads += threads.nodes.filter(t =>
                  !t.isResolved && !t.isOutdated
                  && copilotLogins.includes(t.comments.nodes[0]?.author?.login)
                ).length;
                if (!threads.pageInfo.hasNextPage) break;
                cursor = threads.pageInfo.endCursor;
              }

              if (unresolvedThreads > 0) {
                console.log(`PR #${prNumber}: ${unresolvedThreads} unresolved Copilot thread(s)`);
                // Only comment once
                if (!comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes('Auto-merge skipped'))) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `## Auto-merge skipped\n\nCopilot has ${unresolvedThreads} unresolved review thread(s). Push fixes, resolve each thread with a reply citing the fixing commit, and auto-merge will re-check.`
                  });
                }
                continue;
              }

              // All clear - merge
              const labels = prData.labels.map(l => l.name);
              const complexity = labels.find(l => l.startsWith('complexity:')) || 'unknown';
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              });
              const changedLines = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);
              const fileList = files.map(f => f.filename).join(', ');

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'squash'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `## Auto-merged\n\nCopilot reviewed (${complexity}), no unresolved review threads. Merged automatically.\n\n**${changedLines} lines** across: ${fileList}`
                });
                console.log(`PR #${prNumber} auto-merged`);
              } catch (err) {
                console.log(`PR #${prNumber} merge failed: ${err.message}`);
              }
            }
